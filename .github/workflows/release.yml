name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6.5.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtwebsockets'
          cache: true

      - name: Install Qt Installer Framework
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          tools: 'tools_qtinstallerfw'
          cache: true

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -B build `
            -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Deploy Qt dependencies
        run: |
          $exePath = "build\Release\CodexBarX.exe"
          $qmlDir = "qml"
          windeployqt --qmldir $qmlDir $exePath --no-opengl-sw --no-system-d3d-compiler --no-translations

      - name: Remove unnecessary Qt modules
        run: |
          $releaseDir = "build\Release"
          
          $unneededDlls = @(
            "Qt6Pdf.dll",
            "Qt6PdfQuick.dll",
            "Qt63DRender.dll",
            "Qt63DExtras.dll",
            "Qt63DAnimation.dll",
            "Qt63DCore.dll",
            "Qt63DInput.dll",
            "Qt63DLogic.dll",
            "Qt63DQuickScene2D.dll",
            "Qt6QuickParticles.dll",
            "Qt6Quick3DUtils.dll",
            "Qt6VirtualKeyboard.dll",
            "Qt6ShaderTools.dll",
            "Qt6StateMachine.dll",
            "Qt6StateMachineQml.dll"
          )
          
          foreach ($dll in $unneededDlls) {
            $dllPath = Join-Path $releaseDir $dll
            if (Test-Path $dllPath) {
              Remove-Item $dllPath -Force
              Write-Host "Removed: $dll"
            }
          }
          
          $unneededDirs = @(
            "geometryloaders",
            "renderers",
            "renderplugins",
            "sceneparsers",
            "qmltooling",
            "networkinformation",
            "platforminputcontexts",
            "generic"
          )
          foreach ($dir in $unneededDirs) {
            $dirPath = Join-Path $releaseDir $dir
            if (Test-Path $dirPath) {
              Remove-Item $dirPath -Recurse -Force
              Write-Host "Removed dir: $dir"
            }
          }

          $sqldriversDir = Join-Path $releaseDir "sqldrivers"
          if (Test-Path $sqldriversDir) {
            Remove-Item (Join-Path $sqldriversDir "qsqlodbc.dll") -Force -ErrorAction SilentlyContinue
            Remove-Item (Join-Path $sqldriversDir "qsqlpsql.dll") -Force -ErrorAction SilentlyContinue
            Write-Host "Removed unused SQL drivers (ODBC, PostgreSQL)"
          }

          $qmlDir = Join-Path $releaseDir "qml"
          if (Test-Path $qmlDir) {
            $unneededQml = @(
              "QtQuick\VirtualKeyboard",
              "QtQuick\Pdf",
              "QtQuick\Scene3D",
              "QtQuick\Scene2D",
              "QtQuick\Particles",
              "QtQuick\tooling",
              "QtQuick\NativeStyle",
              "QtQuick\Dialogs",
              "QtQuick\Effects",
              "QtQuick\Timeline",
              "QtQuick\LocalStorage",
              "QtQuick\Shapes"
            )
            foreach ($relPath in $unneededQml) {
              $targetDir = Join-Path $qmlDir $relPath
              if (Test-Path $targetDir) {
                Remove-Item $targetDir -Recurse -Force
                Write-Host "Removed QML: $relPath"
              }
            }
          }
          
          Get-ChildItem -Path $releaseDir -Filter "*.pdb" -Recurse | Remove-Item -Force

      - name: Prepare portable package
        run: |
          $tagName = "${{ github.ref_name }}"
          $packageName = "CodexBarX-$tagName-portable"
          
          New-Item -ItemType Directory -Path "release_package" -Force | Out-Null
          
          Copy-Item -Path "build\Release\*" -Destination "release_package" -Recurse -Force
          
          if (Test-Path "build\translations") {
            New-Item -ItemType Directory -Path "release_package\translations" -Force | Out-Null
            Copy-Item -Path "build\translations\CodexBarX_*.qm" -Destination "release_package\translations" -Force
          }
          
          Compress-Archive -Path "release_package\*" -DestinationPath "$packageName.zip" -Force

      - name: Build installer
        run: |
          $tagName = "${{ github.ref_name }}"
          $version = $tagName -replace '^v', ''
          .\Scripts\build-installer.ps1 -Version $version -BuildType Release
          Write-Host "Installer created: CodexBarX-$version-Installer.exe"

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: CodexBarX ${{ github.ref_name }}
          body: |
            ## Downloads
            
            ### Windows
            - **CodexBarX-${{ github.ref_name }}-portable.zip** - Portable version (no installation required)
            - **CodexBarX-${{ github.ref_name }}-Installer.exe** - Windows installer
            
            ### macOS (Universal — Apple Silicon M1/M2/M3 + Intel)
            - **CodexBarX-${{ github.ref_name }}-macOS.zip** - ZIP archive (extract and drag to Applications)
            - **CodexBarX-${{ github.ref_name }}-macOS.dmg** - DMG disk image (drag to Applications)
            
            ## Changes
            See [commit history](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}) for details.
          files: |
            CodexBarX-${{ github.ref_name }}-portable.zip
            CodexBarX-*-Installer.exe
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # macOS release is built by .github/workflows/release-macos.yml,
  # which runs in parallel on the same tag push and uploads
  # CodexBarX-<tag>-macOS.{zip,dmg} to the release.
