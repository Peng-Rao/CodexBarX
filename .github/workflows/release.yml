name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6.5.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtwebsockets'
          cache: true

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -B build `
            -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Deploy Qt dependencies
        run: |
          $exePath = "build\Release\WinCodexBar.exe"
          $qmlDir = "qml"
          windeployqt --qmldir $qmlDir $exePath --no-opengl-sw --no-system-d3d-compiler --no-translations

      - name: Remove unnecessary Qt modules
        run: |
          $releaseDir = "build\Release"
          
          $unneededDlls = @(
            "Qt6Pdf.dll",
            "Qt6PdfQuick.dll",
            "Qt63DRender.dll",
            "Qt63DExtras.dll",
            "Qt63DAnimation.dll",
            "Qt63DCore.dll",
            "Qt6QuickParticles.dll",
            "Qt6VirtualKeyboard.dll",
            "Qt6ShaderTools.dll"
          )
          
          foreach ($dll in $unneededDlls) {
            $dllPath = Join-Path $releaseDir $dll
            if (Test-Path $dllPath) {
              Remove-Item $dllPath -Force
              Write-Host "Removed: $dll"
            }
          }
          
          $qml2Dir = Join-Path $releaseDir "QtQml"
          if (Test-Path $qml2Dir) {
            $unneededQml = @("Pdf", "3D", "VirtualKeyboard", "QuickParticles")
            foreach ($dir in $unneededQml) {
              $targetDir = Join-Path $qml2Dir $dir
              if (Test-Path $targetDir) {
                Remove-Item $targetDir -Recurse -Force
                Write-Host "Removed QML dir: $dir"
              }
            }
          }
          
          Get-ChildItem -Path $releaseDir -Filter "*.pdb" -Recurse | Remove-Item -Force

      - name: Prepare release package
        run: |
          $tagName = "${{ github.ref_name }}"
          $packageName = "WinCodexBar-$tagName"
          
          New-Item -ItemType Directory -Path "release_package" -Force | Out-Null
          
          Copy-Item -Path "build\Release\*" -Destination "release_package" -Recurse -Force
          
          if (Test-Path "build\translations") {
            New-Item -ItemType Directory -Path "release_package\translations" -Force | Out-Null
            Copy-Item -Path "build\translations\*.qm" -Destination "release_package\translations" -Force
          }
          
          Compress-Archive -Path "release_package\*" -DestinationPath "$packageName.zip" -Force

      - name: Create Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          name: WinCodexBar ${{ github.ref_name }}
          body: |
            ## Changes
            See commit history for details.
          files: WinCodexBar-${{ github.ref_name }}.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
