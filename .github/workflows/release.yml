name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6.5.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtwebsockets'
          cache: true

      - name: Install Qt Installer Framework
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          tools: 'tools_qtinstallerfw'
          cache: true

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -B build `
            -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Deploy Qt dependencies
        run: |
          $exePath = "build\Release\WinCodexBar.exe"
          $qmlDir = "qml"
          windeployqt --qmldir $qmlDir $exePath --no-opengl-sw --no-system-d3d-compiler --no-translations

      - name: Remove unnecessary Qt modules
        run: |
          $releaseDir = "build\Release"
          
          $unneededDlls = @(
            "Qt6Pdf.dll",
            "Qt6PdfQuick.dll",
            "Qt63DRender.dll",
            "Qt63DExtras.dll",
            "Qt63DAnimation.dll",
            "Qt63DCore.dll",
            "Qt6QuickParticles.dll",
            "Qt6VirtualKeyboard.dll",
            "Qt6ShaderTools.dll"
          )
          
          foreach ($dll in $unneededDlls) {
            $dllPath = Join-Path $releaseDir $dll
            if (Test-Path $dllPath) {
              Remove-Item $dllPath -Force
              Write-Host "Removed: $dll"
            }
          }
          
          $qml2Dir = Join-Path $releaseDir "QtQml"
          if (Test-Path $qml2Dir) {
            $unneededQml = @("Pdf", "3D", "VirtualKeyboard", "QuickParticles")
            foreach ($dir in $unneededQml) {
              $targetDir = Join-Path $qml2Dir $dir
              if (Test-Path $targetDir) {
                Remove-Item $targetDir -Recurse -Force
                Write-Host "Removed QML dir: $dir"
              }
            }
          }
          
          Get-ChildItem -Path $releaseDir -Filter "*.pdb" -Recurse | Remove-Item -Force

      - name: Prepare portable package
        run: |
          $tagName = "${{ github.ref_name }}"
          $packageName = "WinCodexBar-$tagName-portable"
          
          New-Item -ItemType Directory -Path "release_package" -Force | Out-Null
          
          Copy-Item -Path "build\Release\*" -Destination "release_package" -Recurse -Force
          
          if (Test-Path "build\translations") {
            New-Item -ItemType Directory -Path "release_package\translations" -Force | Out-Null
            Copy-Item -Path "build\translations\*.qm" -Destination "release_package\translations" -Force
          }
          
          Compress-Archive -Path "release_package\*" -DestinationPath "$packageName.zip" -Force

      - name: Build installer
        run: |
          $tagName = "${{ github.ref_name }}"
          $version = $tagName -replace '^v', ''
          
          # Find Qt IFW bin directory
          $ifwBin = Get-ChildItem -Path "${{ env.Qt6_DIR }}\..\..\Tools\QtInstallerFramework" -Filter "binarycreator.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $ifwBin) {
            Write-Host "Searching in Qt Tools directory..."
            $ifwBin = Get-ChildItem -Path "C:\Qt\Tools\QtInstallerFramework" -Filter "binarycreator.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          
          if ($ifwBin) {
            $binDir = Split-Path $ifwBin.FullName
            $env:PATH = "$binDir;$env:PATH"
            Write-Host "Found Qt IFW at: $binDir"
          } else {
            Write-Warning "Qt IFW not found, skipping installer build"
            exit 0
          }
          
          # Prepare installer data
          $dataDir = "installer\packages\com.wincodexbar.app\data"
          if (Test-Path $dataDir) { Remove-Item -Recurse -Force $dataDir }
          New-Item -ItemType Directory -Path $dataDir -Force | Out-Null
          Copy-Item -Path "build\Release\*" -Destination $dataDir -Recurse -Force
          
          if (Test-Path "build\translations") {
            Copy-Item -Path "build\translations" -Destination $dataDir -Recurse -Force
          }
          
          # Update version
          $releaseDate = Get-Date -Format "yyyy-MM-dd"
          $configXml = "installer\config\config.xml"
          $packageXml = "installer\packages\com.wincodexbar.app\meta\package.xml"
          
          (Get-Content $configXml) -replace '<Version>[^<]*</Version>', "<Version>$version</Version>" | Set-Content $configXml
          (Get-Content $packageXml) -replace '<Version>[^<]*</Version>', "<Version>$version</Version>" -replace '<ReleaseDate>[^<]*</ReleaseDate>', "<ReleaseDate>$releaseDate</ReleaseDate>" | Set-Content $packageXml
          
          # Build installer
          Push-Location installer
          try {
            binarycreator.exe -c "config\config.xml" -p "packages" "..\WinCodexBar-$version-Installer.exe"
          } finally {
            Pop-Location
          }
          
          Write-Host "Installer created: WinCodexBar-$version-Installer.exe"

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: WinCodexBar ${{ github.ref_name }}
          body: |
            ## Downloads
            
            ### Windows
            - **WinCodexBar-${{ github.ref_name }}-portable.zip** - Portable version (no installation required)
            - **WinCodexBar-${{ github.ref_name }}-Installer.exe** - Windows installer
            
            ### macOS
            - **WinCodexBar-${{ github.ref_name }}-macOS.zip** - ZIP archive (extract and drag to Applications)
            - **WinCodexBar-${{ github.ref_name }}-macOS.dmg** - DMG disk image (drag to Applications)
            
            ## Changes
            See [commit history](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}) for details.
          files: |
            WinCodexBar-${{ github.ref_name }}-portable.zip
            WinCodexBar-*-Installer.exe
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-release-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6.5.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtwebsockets'
          cache: true

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build --parallel

      - name: Deploy Qt dependencies
        run: |
          ${{ env.Qt6_DIR }}/bin/macdeployqt build/WinCodexBar.app -qmldir=qml

      - name: Copy translations
        run: |
          if [ -d "build/translations" ]; then
            mkdir -p build/WinCodexBar.app/Contents/MacOS/translations
            cp build/translations/*.qm build/WinCodexBar.app/Contents/MacOS/translations/
          fi

      - name: Ad-hoc sign
        run: |
          codesign --deep --force --sign - build/WinCodexBar.app

      - name: Create ZIP package
        run: |
          ditto -c -k --keepParent build/WinCodexBar.app WinCodexBar-${{ github.ref_name }}-macOS.zip

      - name: Create DMG package
        run: |
          mkdir -p dmg_staging
          cp -R build/WinCodexBar.app dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "WinCodexBar" -srcfolder dmg_staging -ov -format UDZO WinCodexBar-${{ github.ref_name }}-macOS.dmg

      - name: Upload macOS artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            WinCodexBar-${{ github.ref_name }}-macOS.zip
            WinCodexBar-${{ github.ref_name }}-macOS.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
